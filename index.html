<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TMSEG" />
    <meta name="application-name" content="TMSEG" />
    <meta name="theme-color" content="#450a0a" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="shortcut icon" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>Grupo TMSEG - Sistema de Gestão</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;500;600;700&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              montserrat: ['"Montserrat"', 'sans-serif'],
              opensans: ['"Open Sans"', 'sans-serif'],
              roboto: ['"Roboto"', 'sans-serif'],
            },
            colors: {
              brand: {
                dark: '#0a0a0a',
                red: '#450a0a',
                crimson: '#7f1d1d',
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --vh: 1vh;
      }
      .print-only { display: none; }
      @media print {
        @page { size: A4 landscape; margin: 6mm; }
        html, body { background: #fff !important; height: auto !important; overflow: visible !important; }
        body.print-divergence > *:not([data-testid="modal-divergence"]) { display: none !important; }
        body.print-divergence [data-testid="modal-divergence"] {
          position: static !important; inset: auto !important;
          background: #fff !important; padding: 0 !important; z-index: auto !important;
          display: block !important;
        }
        body.print-divergence [data-testid="modal-divergence"] > div {
          max-width: 100% !important; max-height: none !important; box-shadow: none !important;
          border: none !important; border-radius: 0 !important; overflow: visible !important;
        }
        body.print-divergence .no-print { display: none !important; }
        body.print-divergence .print-only { display: block !important; }
        body.print-divergence .max-h-\[55vh\], body.print-divergence [class*="max-h-"] { max-height: none !important; overflow: visible !important; }
        body.print-divergence .overflow-x-auto, body.print-divergence .overflow-y-auto, body.print-divergence .overflow-auto { overflow: visible !important; }
        body.print-divergence table { font-size: 8px !important; width: 100% !important; page-break-inside: auto; }
        body.print-divergence thead { display: table-header-group; }
        body.print-divergence tr { page-break-inside: avoid; }
        body.print-divergence th, body.print-divergence td { padding: 2px 4px !important; }
        body.print-divergence textarea { display: none !important; }
        body.print-divergence { zoom: 0.78; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        body.print-divergence * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      }
      html, body {
        height: 100%;
        height: -webkit-fill-available;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f3f4f6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #root {
        min-height: 100%;
        min-height: -webkit-fill-available;
      }
      .h-screen-ios {
        height: 100vh;
        height: calc(var(--vh, 1vh) * 100);
        height: -webkit-fill-available;
      }
      .min-h-screen-ios {
        min-height: 100vh;
        min-height: calc(var(--vh, 1vh) * 100);
        min-height: -webkit-fill-available;
      }
      @supports (height: 100dvh) {
        .h-screen-ios { height: 100dvh; }
        .min-h-screen-ios { min-height: 100dvh; }
      }
      .py-safe {
          padding-top: env(safe-area-inset-top, 0px);
          padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .scrollbar-thin::-webkit-scrollbar {
          width: 6px;
          height: 6px;
      }
      .scrollbar-thin::-webkit-scrollbar-track {
          background: transparent;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
          background: #cbd5e1;
          border-radius: 3px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb:hover {
          background: #94a3b8;
      }
      .scrollbar-thin {
          scrollbar-width: thin;
          scrollbar-color: #cbd5e1 transparent;
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-in-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; -webkit-transform: translateY(10px); transform: translateY(10px); }
        to { opacity: 1; -webkit-transform: translateY(0); transform: translateY(0); }
      }
      #ios-error-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #1e293b;
        color: #f1f5f9;
        padding: 24px;
        font-family: 'Plus Jakarta Sans', monospace, sans-serif;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #ios-error-overlay.active { display: flex; flex-direction: column; }
      #ios-error-overlay h2 { color: #f87171; font-size: 18px; font-weight: 800; margin-bottom: 12px; }
      #ios-error-overlay pre { background: #0f172a; padding: 16px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; word-break: break-all; overflow-x: auto; -webkit-overflow-scrolling: touch; flex: 1; }
      #ios-error-overlay button { margin-top: 16px; background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; -webkit-appearance: none; }
    </style>
    <script>
      (function() {
        function setVh() {
          var vh = window.innerHeight * 0.01;
          document.documentElement.style.setProperty('--vh', vh + 'px');
        }
        setVh();
        window.addEventListener('resize', setVh);
        window.addEventListener('orientationchange', function() { setTimeout(setVh, 100); });

        window.onerror = function(msg, src, line, col, err) {
          showIosError('Erro JS Global', msg + '\nArquivo: ' + (src || '?') + '\nLinha: ' + (line || '?') + ':' + (col || '?') + '\n\n' + (err && err.stack ? err.stack : ''));
          return false;
        };
        window.addEventListener('unhandledrejection', function(ev) {
          var reason = ev.reason;
          var detail = reason instanceof Error ? reason.message + '\n' + reason.stack : String(reason);
          showIosError('Promise Rejeitada', detail);
        });
        window.showIosError = function(title, detail) {
          var el = document.getElementById('ios-error-overlay');
          if (!el) return;
          el.innerHTML = '<h2>ERRO: ' + title + '</h2><pre>' + detail + '</pre><button onclick="location.reload()">Recarregar App</button><p style="margin-top:8px;font-size:11px;color:#94a3b8;">Envie esta tela ao suporte tecnico.</p>';
          el.classList.add('active');
        };
      })();
    </script>

    <style>
      /* ============================================================
         Estilos de Impressão (window.print / Ctrl+P)
         Esconde sidebar, header, botões de ação e mantém só o conteúdo.
         IMPORTANTE: @page fica fora do @media print porque Chrome/Edge
         respeitam melhor a orientação quando declarada no nível raiz.
         ============================================================ */
      @page {
        size: A4 landscape;
        margin: 8mm;
      }

      @media print {
        html, body {
          background: #ffffff !important;
          color: #000000 !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        /* Esconde estrutura de chrome do app */
        aside,
        header,
        footer,
        .no-print,
        [data-no-print] {
          display: none !important;
        }
        /* Remove o offset reservado para a sidebar */
        .lg\:pl-20 { padding-left: 0 !important; }
        main {
          overflow: visible !important;
          padding: 0 !important;
          margin: 0 !important;
          height: auto !important;
          width: 100% !important;
        }
        /* Container raiz ocupa toda a largura disponível */
        #root, #root > div, main > div {
          width: 100% !important;
          max-width: 100% !important;
          overflow: visible !important;
        }
        /* Remove sombras */
        .shadow-sm, .shadow, .shadow-md, .shadow-lg, .shadow-xl, .shadow-2xl {
          box-shadow: none !important;
        }
        /* Cards de Visão Geral: mais compactos pra sobrar espaço pra tabela */
        .grid {
          gap: 6px !important;
        }
        .p-4, .p-5, .p-6 { padding: 6px !important; }
        .rounded-xl, .rounded-2xl { border-radius: 6px !important; }
        /* Tabelas — não corta linha entre páginas, repete cabeçalho */
        table {
          width: 100% !important;
          border-collapse: collapse !important;
          page-break-inside: auto;
        }
        thead { display: table-header-group; }
        tfoot { display: table-footer-group; }
        tr { page-break-inside: avoid !important; break-inside: avoid !important; }
        td, th { padding: 4px 6px !important; }
        /* Tipografia compacta para caber tudo */
        body { font-size: 9pt; }
        table { font-size: 8.5pt; }
        h1, h2, h3 { font-size: 12pt !important; }
        /* Inputs/botões viram texto plano */
        button, input, select, textarea {
          border: none !important;
          background: transparent !important;
          color: inherit !important;
          -webkit-appearance: none;
          appearance: none;
          padding: 0 !important;
        }
        /* IMPORTANTE: NÃO esconder .fixed indiscriminadamente — quebra o
           MissionPrintModal (e outros modais que têm CSS de impressão próprio
           e renderizam o conteúdo dentro de um wrapper .fixed). Cada modal
           que precisar bloquear impressão deve usar a classe .no-print. */
        /* Fundo decorativo do app é absoluto — esconde */
        .absolute.inset-0.z-0 { display: none !important; }
        /* Garante que nada quebre o layout horizontal */
        * { overflow: visible !important; }
      }
    </style>
  </head>
  <body>
    <div id="ios-error-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
