<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Usuário online">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#f8fafc"/>
  <!-- laptop base -->
  <rect x="14" y="44" width="36" height="6" rx="1.5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="16" y="38" width="32" height="8" rx="1" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <!-- body -->
  <ellipse cx="32" cy="34" rx="11" ry="9" fill="url(#body)" stroke="#cbd5e1" stroke-width="1"/>
  <!-- arms -->
  <rect x="17" y="30" width="5" height="10" rx="2.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="42" y="30" width="5" height="10" rx="2.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <!-- head -->
  <circle cx="32" cy="18" r="12" fill="url(#body)" stroke="#cbd5e1" stroke-width="1"/>
  <!-- face visor -->
  <rect x="22" y="14" width="20" height="10" rx="5" fill="#0f172a"/>
  <!-- eyes -->
  <ellipse cx="27" cy="19" rx="3" ry="2.2" fill="url(#eyeGlow)"/>
  <ellipse cx="37" cy="19" rx="3" ry="2.2" fill="url(#eyeGlow)"/>
  <ellipse cx="27.5" cy="18.5" rx="1" ry="0.7" fill="#ecfeff" opacity="0.9"/>
  <ellipse cx="37.5" cy="18.5" rx="1" ry="0.7" fill="#ecfeff" opacity="0.9"/>
  <!-- antenna -->
  <line x1="32" y1="6" x2="32" y2="3" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="32" cy="2.5" r="1.5" fill="#06b6d4"/>
</svg>
