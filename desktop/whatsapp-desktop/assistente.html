<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Instalador TM SEG</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: #fff; font-family: "Segoe UI", sans-serif;
      background:
        radial-gradient(900px 520px at 18% 18%, rgba(196, 0, 24, .28), transparent 60%),
        radial-gradient(700px 420px at 80% 80%, rgba(255, 45, 45, .08), transparent 55%),
        #050507;
    }
    main { width: min(520px, calc(100% - 32px)); margin: 28px auto; }
    .card {
      padding: 28px 26px 22px; border-radius: 28px;
      background: linear-gradient(180deg, rgba(16,16,20,.86), rgba(8,8,10,.92));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
    }
    .marca { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
    .marca img { height: 64px; width: auto; }
    h1 { margin: 0; font-size: 24px; letter-spacing: .04em; }
    h1 span { color: #ef4444; }
    .sub { margin: 2px 0 0; color: #6b7280; font-size: 10px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h2 { margin: 0 0 8px; font-size: 22px; }
    p { color: rgba(255,255,255,.78); line-height: 1.5; }
    .selos { display: flex; gap: 8px; margin: 14px 0; }
    .selo { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); border-radius: 10px; padding: 8px 10px; color: #9ca3af; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .barra { display: flex; gap: 6px; margin: 8px 0 18px; }
    .barra i { flex: 1; height: 4px; border-radius: 99px; background: rgba(255,255,255,.12); }
    .barra i.feita { background: #dc2626; }
    label.ok { display: flex; gap: 8px; align-items: flex-start; color: #e5e7eb; font-size: 13px; }
    footer { display: flex; justify-content: space-between; margin-top: 18px; }
    button { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
    button.sec { background: rgba(255,255,255,.06); color: #fff; border: 1px solid rgba(255,255,255,.12); }
    button.pri { color: #fff; background: linear-gradient(90deg, #b91c1c, #dc2626, #b91c1c); box-shadow: 0 10px 24px rgba(127, 29, 29, .35); }
    button:disabled { opacity: .4; cursor: default; }
    code { color: #fecaca; }
    .aviso { color: #fecaca; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="marca">
        <img src="/logo.png" alt="Grupo TM SEG" />
        <div>
          <h1>GRUPO TM<span>SEG</span></h1>
          <p class="sub">Intermediadora de Escolta Armada &amp; Seg. Patrimonial</p>
        </div>
      </div>
      <div class="selos"><span class="selo">Conexão segura</span><span class="selo">Criptografado</span></div>
      <div class="barra" id="passos"></div>
      <h2 id="titulo"></h2>
      <div id="painel"></div>
      <footer>
        <button class="sec" id="voltar" type="button">Voltar</button>
        <button class="pri" id="avancar" type="button">Avançar</button>
      </footer>
    </section>
  </main>
  <script>
    const etapas = [
      ['Boas-vindas', 'Segurança em movimento. Este assistente prepara o computador para a integração oficial com o WhatsApp Desktop. Nenhuma senha do WhatsApp é pedida. Ao avançar, o que faltar é instalado e configurado.'],
      ['Verificação do computador', 'Conferindo Node.js, Python e WhatsApp. O próximo passo instala o que ainda não estiver neste computador.'],
      ['Instalação dos componentes', 'Ao avançar, o assistente instala Node.js, Python e WhatsApp, se faltarem, e configura o conector do Grupo TM SEG. Não há comando para digitar.'],
      ['Configuração do WhatsApp', 'O WhatsApp oficial abre neste computador. Se a conta ainda não estiver conectada, use o QR Code na tela do próprio aplicativo.'],
      ['Conexão com TM SEG', 'Depois desta etapa o TM SEG reconhece o computador sozinho. O código abaixo só é necessário se a identificação automática falhar.'],
      ['Teste de funcionamento', 'Todo envio abre o WhatsApp, clica em Conversas, pesquisa o grupo, abre esse grupo, cola a mensagem em Digite uma mensagem, envia e apaga a pesquisa. Se errar o campo, volta a etapa. Com vários grupos, repete a sequência em cada um. O teste usa GRUPO TM SEG - ADM.'],
      ['Instalação concluída', 'O computador fica registrado. Nas próximas aberturas a instalação, o QR Code e o teste não se repetem.']
    ];
    let atual = 0;
    let autorizado = false;
    let inicioAutomatico = true;
    let jaPreparado = false;
    let reauth = false;
    const passos = document.getElementById('passos');
    etapas.forEach(() => passos.appendChild(document.createElement('i')));
    const titulo = document.getElementById('titulo');
    const painel = document.getElementById('painel');
    const voltar = document.getElementById('voltar');
    const avancar = document.getElementById('avancar');
    function desenhar() {
      [...passos.children].forEach((el, i) => { el.className = i <= atual ? 'feita' : ''; });
      titulo.textContent = etapas[atual][0];
      painel.innerHTML = '<p>' + etapas[atual][1] + '</p><div id="extra"></div>';
      voltar.disabled = atual === 0;
      avancar.textContent = atual === etapas.length - 1 ? 'Concluir' : 'Avançar';
      const extra = document.getElementById('extra');
      if (atual === 1) fetch('/install/check').then(r => r.json()).then(d => {
        const itens = (d.componentes || []).map(c => '<p>' + c.nome + ': ' + (c.instalado ? 'já instalado' : 'será instalado ao avançar') + '</p>').join('');
        extra.innerHTML = '<p>' + d.mensagem + '</p>' + itens;
      });
      if (atual === 2) {
        extra.innerHTML = '<label class="ok"><input id="inicio" type="checkbox"' + (inicioAutomatico ? ' checked' : '') + '> O conector inicia junto com o Windows.</label><div id="lista"></div><p id="pasta"></p>';
        extra.querySelector('#inicio').onchange = (e) => { inicioAutomatico = e.target.checked; };
        fetch('/install/check').then(r => r.json()).then(d => {
          const lista = document.getElementById('lista');
          if (!lista) return;
          lista.innerHTML = (d.componentes || []).map(c => '<p>' + c.nome + ': ' + (c.instalado ? 'já instalado' : 'será instalado agora') + '</p>').join('');
        });
      }
      if (atual === 3) fetch('/install/whatsapp').then(r => r.json()).then(d => {
        const aviso = reauth ? '<p>A instalação e o teste já estão salvos. Só a conta do WhatsApp precisa ser conectada de novo, pelo QR Code.</p>' : '';
        extra.innerHTML = aviso + '<p>' + d.mensagem + '</p>' + (d.instalado ? '' : '<p><a href="' + d.canalOficial + '" style="color:#fecaca">Abrir o canal oficial do WhatsApp</a></p>');
        if (d.instalado) fetch('/install/whatsapp/abrir', { method: 'POST' });
      });
      if (atual === 4) fetch('/pair/code').then(r => r.json()).then(d => { extra.innerHTML = '<p>Código desta máquina</p><code>' + d.codigo + '</code>'; });
      if (atual === 5) {
        extra.innerHTML = '<label class="ok"><input id="autorizo" type="checkbox"> Autorizo o envio único da mensagem de ativação para GRUPO TM SEG - ADM.</label><pre id="previa" style="white-space:pre-wrap;color:#e5e7eb;font-size:12px"></pre><p class="aviso" id="resultado"></p>';
        document.getElementById('autorizo').onchange = (e) => { autorizado = e.target.checked; };
        fetch('/install/mensagem').then(r => r.json()).then(d => { document.getElementById('previa').textContent = d.mensagem; });
      }
      if (atual === 6) {
        const texto = jaPreparado
          ? 'Este computador já está preparado. Abra o TM SEG. O conector identifica o dispositivo sem nova instalação, sem QR Code e sem nova mensagem de teste.'
          : 'Concluindo o registro deste computador.';
        extra.innerHTML = '<p>' + texto + '</p><p id="registro"></p>';
        if (!jaPreparado) {
          fetch('/dispositivo/preparar', { method: 'POST' }).then(r => r.json()).then(d => {
            jaPreparado = !!d.preparado;
            const registro = document.getElementById('registro');
            if (registro) registro.textContent = d.instalacaoId ? 'Identificador da instalação: ' + d.instalacaoId : '';
          });
        } else {
          fetch('/identificar').then(r => r.json()).then(d => {
            const registro = document.getElementById('registro');
            if (registro) registro.textContent = d.instalacaoId ? 'Identificador da instalação: ' + d.instalacaoId : '';
          });
        }
      }
    }
    voltar.onclick = () => {
      if (jaPreparado && !reauth) return;
      if (reauth && atual <= 3) return;
      if (atual > 0) { atual--; desenhar(); }
    };
    avancar.onclick = async () => {
      if (reauth && atual === 3) { atual = 6; desenhar(); return; }
      if (atual === 2) {
        avancar.disabled = true;
        voltar.disabled = true;
        const extra = document.getElementById('extra');
        const lista = await fetch('/install/check').then(r => r.json());
        const faltam = (lista.componentes || []).filter(c => !c.instalado);
        const linhas = [];
        for (const item of faltam) {
          linhas.push('Instalando ' + item.nome + '…');
          if (extra) extra.innerHTML = '<p>' + linhas.join('<br>') + '</p><p id="pasta"></p>';
          const resp = await fetch('/install/componente', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: item.id }) }).then(r => r.json());
          linhas[linhas.length - 1] = resp.ok ? (item.nome + ' instalado.') : (resp.motivo || ('Não foi possível instalar ' + item.nome + '.'));
          if (extra) extra.innerHTML = '<p>' + linhas.join('<br>') + '</p><p id="pasta"></p>';
          if (!resp.ok) {
            avancar.disabled = false;
            voltar.disabled = atual === 0;
            avancar.textContent = 'Avançar';
            return;
          }
        }
        if (extra) extra.innerHTML = '<p>' + (linhas.join('<br>') || 'Aplicativos já instalados.') + '</p><p>Configurando o conector…</p><p id="pasta"></p>';
        const preparo = await fetch('/install/apply', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ autostart: inicioAutomatico }) }).then(r => r.json());
        const pasta = document.getElementById('pasta');
        if (pasta) pasta.textContent = preparo.ok ? ('Pasta local: ' + preparo.pasta + '. ' + ((preparo.inicio && preparo.inicio.motivo) || '')) : 'Não foi possível preparar a pasta local.';
        avancar.disabled = false;
        voltar.disabled = false;
        avancar.textContent = 'Avançar';
        if (!preparo.ok) return;
      }
      if (atual === 5) {
        const resultado = document.getElementById('resultado');
        if (!autorizado) { resultado.textContent = 'Marque a autorização para seguir. Nada foi enviado.'; return; }
        const codigo = await fetch('/pair/code').then(r => r.json());
        const resposta = await fetch('/homologacao', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + codigo.codigo }, body: JSON.stringify({ autorizar: true }) });
        const corpo = await resposta.json();
        resultado.textContent = corpo.motivo || (corpo.ok ? 'Comando executado. Entrega não comprovada.' : 'O teste não foi enviado.');
        if (!corpo.ok && !corpo.registrado) return;
      }
      if (atual === etapas.length - 1) return;
      atual++;
      desenhar();
    };
    fetch('/identificar').then(r => r.json()).then(d => {
      jaPreparado = !!d.preparado;
      reauth = !!d.precisaReautenticar;
      if (jaPreparado && reauth) atual = 3;
      else if (jaPreparado) atual = 6;
      desenhar();
    }).catch(() => desenhar());
  </script>
</body>
</html>
