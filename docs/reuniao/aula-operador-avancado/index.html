<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Aula Operador e Avançado — Grupo TM SEG</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0c0c0c; color: #111; font-family: "Segoe UI", Arial, sans-serif; }
  #moldura { margin: 12px auto 0; position: relative; overflow: hidden; }
  #palco { width: 1920px; height: 1080px; background: #f3f4f6; position: relative; transform-origin: top left; }
  .topo { height: 56px; background: #111; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; }
  .marca { font-weight: 800; letter-spacing: 0.18em; font-size: 18px; }
  .marca span { color: #dc2626; }
  .topo-meio { font-size: 15px; color: #d1d5db; letter-spacing: 0.04em; }
  .topo-num { font-size: 15px; color: #fca5a5; font-weight: 700; }
  .miolo { height: 748px; display: flex; overflow: hidden; }
  .side { width: 300px; background: linear-gradient(180deg, #000 0%, #1a0505 55%, #450a0a 100%); color: #fff; padding: 12px 10px; overflow: hidden; }
  .logo-bloco { padding: 4px 12px 10px; border-bottom: 1px solid rgba(255,255,255,.12); margin-bottom: 8px; }
  .logo-bloco small { letter-spacing: .22em; color: #d1d5db; font-size: 11px; }
  .logo-bloco strong { display: block; color: #dc2626; font-size: 22px; letter-spacing: .14em; }
  .perfil-side { margin: 0 8px 8px; background: rgba(255,255,255,.06); border-radius: 10px; padding: 6px 10px; font-size: 13px; color: #fecaca; font-weight: 700; }
  .item { padding: 6px 12px; border-radius: 8px; color: #e5e7eb; font-size: 14px; margin-bottom: 1px; }
  .item.grupo { color: #fff; font-weight: 700; }
  .filho { padding: 4px 12px 4px 32px; color: #d1d5db; font-size: 13px; border-radius: 8px; }
  .filho.on, .item.on { background: rgba(255,255,255,.08); color: #f87171; font-weight: 700; }
  .foco { outline: 4px solid #f97316; outline-offset: 2px; border-radius: 10px; }
  .main { flex: 1; padding: 22px 26px; overflow: hidden; }
  .h1 { font-size: 28px; font-weight: 800; margin: 0 0 6px; }
  .sub { color: #6b7280; font-size: 16px; margin: 0 0 16px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 16px 18px; }
  .row { display: flex; gap: 14px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  .btn-laranja { background: #f97316; color: #111; padding: 12px 18px; font-size: 14px; }
  .btn-preto { background: #111; color: #fff; padding: 12px 18px; font-size: 14px; }
  .btn-branco { background: #fff; color: #6b7280; border: 1px solid #e5e7eb; padding: 12px 18px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; font-size: 12px; letter-spacing: .06em; color: #6b7280; padding: 8px 10px; border-bottom: 1px solid #e5e7eb; }
  td { padding: 12px 10px; border-bottom: 1px solid #f3f4f6; }
  .tag { font-size: 12px; font-weight: 800; padding: 4px 8px; border-radius: 999px; }
  .tag-azul { background: #dbeafe; color: #1d4ed8; }
  .tag-verde { background: #dcfce7; color: #166534; }
  .tag-cinza { background: #f3f4f6; color: #374151; }
  .opcao { flex: 1; border: 2px solid #e5e7eb; border-radius: 14px; padding: 18px; background: #fff; }
  .opcao.carac { border-color: #dc2626; background: #fef2f2; }
  .opcao.vel { border-color: #111; background: #111; color: #fff; }
  .campo label { display: block; font-size: 12px; font-weight: 800; letter-spacing: .06em; color: #6b7280; margin-bottom: 6px; text-transform: uppercase; }
  .campo .box { background: #fff; border: 1px solid #d1d5db; border-radius: 10px; padding: 12px 14px; font-size: 16px; font-weight: 700; }
  .passo { font-size: 13px; font-weight: 800; color: #dc2626; letter-spacing: .08em; }
  .legenda { height: 276px; background: #111; color: #fff; padding: 16px 36px 14px; }
  .legenda .quem { display: inline-block; background: #dc2626; color: #fff; font-size: 13px; font-weight: 800; letter-spacing: .12em; padding: 4px 10px; border-radius: 999px; }
  .legenda h2 { margin: 10px 0 8px; font-size: 22px; }
  .legenda p { margin: 0; font-size: 22px; line-height: 1.32; color: #f9fafb; }
  .capa { height: 748px; background: linear-gradient(160deg, #000 0%, #1a0505 50%, #450a0a 100%); color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 0 90px; }
  .capa .k { letter-spacing: .28em; color: #fca5a5; font-weight: 700; }
  .capa h1 { font-size: 78px; line-height: 1.02; margin: 12px 0; }
  .capa h1 span { color: #dc2626; }
  .capa .linha { width: 120px; height: 6px; background: #dc2626; margin: 18px 0; }
  .capa p { font-size: 30px; color: #e5e7eb; max-width: 1100px; margin: 0; }
  .chips { display: flex; gap: 12px; margin-top: 28px; }
  .chip { border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 10px 16px; font-size: 16px; }
  .bloqueio { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; border-radius: 12px; padding: 14px 16px; font-weight: 700; }
  .ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; border-radius: 12px; padding: 14px 16px; font-weight: 700; }
  #controles { width: min(1100px, 96vw); margin: 10px auto 16px; display: flex; gap: 10px; align-items: center; justify-content: center; }
  #controles button { background: #fff; color: #111; border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 800; font-size: 16px; cursor: pointer; }
  #controles button.play { background: #f97316; }
  #controles span { color: #d1d5db; font-size: 14px; }
  body.gravar #controles, body.gravar #moldura { margin: 0; }
  body.gravar { background: #000; }
</style>
</head>

<script>
const CENAS = JSON.parse(document.getElementById('cenas-json').textContent);
const params = new URLSearchParams(location.search);
const gravar = params.get('gravar') === '1';
let indice = Math.max(0, Math.min(CENAS.length - 1, parseInt(params.get('cena') || '0', 10) || 0));
let tocando = false;
let vozPronta = false;

const MENUS = {
  operador: [
    { nome: 'Página Inicial' },
    { nome: 'Monitoramento', filhos: ['Painel de OS', 'Controle Diário'] },
    { nome: 'Rede de Apoio (QRF)' },
    { nome: 'Fornecedor', filhos: ['Mapa de Acionamento'] }
  ],
  avancado: [
    { nome: 'Página Inicial' },
    { nome: 'Monitoramento', filhos: ['Painel de OS', 'Controle Diário', 'Relatório de OS', 'Ranking DHL'] },
    { nome: 'Rede de Apoio (QRF)' },
    { nome: 'Cliente', filhos: ['Cadastro de Cliente', 'Veículos (Carga)', 'Cadastro de Rotas'] },
    { nome: 'Fornecedor', filhos: ['Cadastro de Fornecedor', 'Gestão de Alvarás', 'Cadastro de Viaturas', 'Cadastro de Agentes'] }
  ]
};

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function on(nome, foco) { return nome === foco ? ' on foco' : ''; }

function sidebar(menu, foco, perfil) {
  const blocos = MENUS[menu].map(item => {
    const filhos = (item.filhos || []).map(f => `<div class="filho${on(f, foco)}">${esc(f)}</div>`).join('');
    const ativo = item.nome === foco ? ' on foco' : '';
    return `<div class="item${item.filhos ? ' grupo' : ''}${ativo}">${esc(item.nome)}</div>${filhos}`;
  }).join('');
  return `<aside class="side">
    <div class="logo-bloco"><small>GRUPO</small><strong>TMSEG</strong></div>
    <div class="perfil-side">Perfil ${esc(perfil)}</div>
    ${blocos}
  </aside>`;
}

function moldura(cena, miolo, menu) {
  const n = indice + 1;
  const side = menu ? sidebar(menu, cena.foco || '', cena.perfil) : '';
  return `<div class="topo">
      <div class="marca">GRUPO <span>TMSEG</span></div>
      <div class="topo-meio">Aula · Operador e Avançado</div>
      <div class="topo-num">${n} / ${CENAS.length}</div>
    </div>
    <div class="miolo">${side}<div class="main">${miolo}</div></div>
    <div class="legenda">
      <span class="quem">${esc(cena.perfil.toUpperCase())}</span>
      <h2>${esc(cena.titulo)}</h2>
      <p>${esc(cena.fala)}</p>
    </div>`;
}

function capa(cena) {
  return `<div class="topo">
      <div class="marca">GRUPO <span>TMSEG</span></div>
      <div class="topo-meio">Aula · Operador e Avançado</div>
      <div class="topo-num">${indice + 1} / ${CENAS.length}</div>
    </div>
    <div class="capa">
      <div class="k">${esc(cena.kicker)}</div>
      <h1>${cena.manchete}</h1>
      <div class="linha"></div>
      <p>${esc(cena.apoio)}</p>
    </div>
    <div class="legenda">
      <span class="quem">${esc(cena.perfil.toUpperCase())}</span>
      <h2>${esc(cena.titulo)}</h2>
      <p>${esc(cena.fala)}</p>
    </div>`;
}

function osLista(cena) {
  const foco = cena.focoBtn === 'nova' ? ' foco' : '';
  const miolo = `<div style="display:flex;justify-content:space-between;align-items:flex-end">
      <div><p class="h1">Painel de OS</p><p class="sub">Missões em acompanhamento</p></div>
      <button class="btn btn-laranja${foco}">+ Nova Missão</button>
    </div>
    <div class="card">
      <table>
        <tr><th>OS</th><th>CLIENTE</th><th>ROTA</th><th>STATUS</th></tr>
        <tr><td>10421</td><td>CLIENTE EXEMPLO</td><td>SOROCABA → CAMPINAS</td><td><span class="tag tag-azul">Em viagem</span></td></tr>
        <tr><td>10418</td><td>CLIENTE EXEMPLO</td><td>CAMPINAS → SANTOS</td><td><span class="tag tag-verde">Concluída</span></td></tr>
        <tr><td>10402</td><td>OUTRO CLIENTE</td><td>GUARULHOS → CURITIBA</td><td><span class="tag tag-cinza">Solicitada</span></td></tr>
      </table>
    </div>`;
  return moldura(cena, miolo, cena.menu);
}

function osTipo(cena) {
  const miolo = `<p class="passo">ETAPA 1 DE 6</p><p class="h1">Tipo de operação</p><p class="sub">Nova Missão</p>
    <div class="row">
      <div class="opcao carac foco"><strong>CARACTERIZADA</strong><p>Escolta identificada</p></div>
      <div class="opcao vel"><strong>VELADA</strong><p>Escolta discreta</p></div>
    </div>`;
  return moldura(cena, miolo, cena.menu);
}

function osCliente(cena) {
  const miolo = `<p class="passo">ETAPA 2 DE 6</p><p class="h1">Selecionar cliente</p>
    <div class="row">
      <div class="campo" style="flex:2"><label>Cliente</label><div class="box foco">CLIENTE EXEMPLO LTDA</div></div>
      <div class="campo" style="flex:1"><label>Número da S.E.</label><div class="box">SE-10421</div></div>
    </div>
    <p class="sub" style="margin-top:14px">O cliente precisa já estar cadastrado. Cliente novo é com o perfil Avançado.</p>`;
  return moldura(cena, miolo, cena.menu);
}

function osCarga(cena) {
  const miolo = `<p class="passo">ETAPA 3 DE 6</p><p class="h1">Veículo do cliente / motorista</p>
    <div class="row">
      <div class="campo" style="flex:1"><label>Placa da carga</label><div class="box foco">ABC1D23</div></div>
      <div class="campo" style="flex:1"><label>Motorista</label><div class="box">MOTORISTA EXEMPLO</div></div>
      <div class="campo" style="flex:1"><label>Telefone</label><div class="box">(11) 90000-0000</div></div>
    </div>
    <p class="sub" style="margin-top:14px">Caminhão do cliente. A viatura da escolta é outro cadastro.</p>`;
  return moldura(cena, miolo, cena.menu);
}

function osFornecedor(cena) {

function desenhar() {
  const cena = CENAS[indice];
  const fn = TELAS[cena.tela];
  document.getElementById('palco').innerHTML = fn(cena);
  document.body.dataset.pronta = '1';
  if (!gravar) controles();
}

function ajustar() {
  if (gravar) {
    document.body.classList.add('gravar');
    document.getElementById('moldura').style.width = '1920px';
    document.getElementById('moldura').style.height = '1080px';
    return;
  }
  const livre = window.innerHeight - 78;
  const s = Math.min(window.innerWidth / 1920, livre / 1080, 1);
  const palco = document.getElementById('palco');
  palco.style.transform = 'scale(' + s + ')';
  const moldura = document.getElementById('moldura');
  moldura.style.width = (1920 * s) + 'px';
  moldura.style.height = (1080 * s) + 'px';
}

function vozPt() {
  const lista = speechSynthesis.getVoices();
  return lista.find(v => /pt-BR/i.test(v.lang) && /maria|francisca/i.test(v.name))
    || lista.find(v => /pt-BR/i.test(v.lang))
    || lista.find(v => /^pt/i.test(v.lang));
}

function falar(texto) {
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'pt-BR';
    u.rate = 0.96;
    const v = vozPt();
    if (v) u.voice = v;
    u.onend = resolve;
    u.onerror = resolve;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  });
}

async function reproduzir() {
  if (tocando) {
    tocando = false;
    speechSynthesis.cancel();
    controles();
    return;
  }
  tocando = true;
  controles();
  while (tocando && indice < CENAS.length) {
    desenhar();
    await falar(CENAS[indice].fala);
    if (!tocando) break;
    if (indice < CENAS.length - 1) indice += 1;
    else { tocando = false; break; }
  }
  controles();
}

function controles() {
  const box = document.getElementById('controles');
  box.innerHTML = '';
  const anterior = document.createElement('button');
  anterior.textContent = 'Anterior';
  anterior.onclick = () => { tocando = false; speechSynthesis.cancel(); indice = Math.max(0, indice - 1); desenhar(); };
  const play = document.createElement('button');
  play.className = 'play';
  play.textContent = tocando ? 'Pausar' : (indice === 0 ? 'Reproduzir aula' : 'Continuar');
  play.onclick = () => reproduzir();
  const proxima = document.createElement('button');
  proxima.textContent = 'Próxima';
  proxima.onclick = () => { tocando = false; speechSynthesis.cancel(); indice = Math.min(CENAS.length - 1, indice + 1); desenhar(); };
  const info = document.createElement('span');
  info.textContent = 'Cena ' + (indice + 1) + ' de ' + CENAS.length + ' · setas do teclado também mudam a cena';
  box.append(anterior, play, proxima, info);
}

document.addEventListener('keydown', (e) => {
  if (gravar) return;
  if (e.key === 'ArrowRight') { tocando = false; speechSynthesis.cancel(); indice = Math.min(CENAS.length - 1, indice + 1); desenhar(); }
  if (e.key === 'ArrowLeft') { tocando = false; speechSynthesis.cancel(); indice = Math.max(0, indice - 1); desenhar(); }
  if (e.key === ' ') { e.preventDefault(); reproduzir(); }
});

speechSynthesis.onvoiceschanged = () => { vozPronta = true; };
if (gravar) document.body.classList.add('gravar');
window.addEventListener('resize', ajustar);
ajustar();
desenhar();
</script>
